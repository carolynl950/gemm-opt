name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false            # one red cell shouldn't hide the others
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [release, asan, ubsan]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libopenblas-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libomp   # Accelerate ships with macOS; libomp enables the omp kernel

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Checks bench runs end to end (incl. its correctness gate) on square and
      # rectangular shapes. Shared runners are too noisy for timing; numbers are discarded.
      - name: Bench smoke run
        run: >
          ./build/${{ matrix.preset }}/bench --reps 1 --cold
          --shape 1x96x64 --shape 33x17x65 64 > /dev/null
